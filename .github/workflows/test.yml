name: Tests & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 防止同分支在运行的 workflow 被打断
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # 仅安装测试所需的最小依赖（不装 playwright 等大块）
          pip install Flask==3.0.3 Werkzeug==3.0.3 \
                      requests==2.32.3 urllib3==2.2.2 \
                      beautifulsoup4==4.12.3 lxml==5.2.2 \
                      Flask-Limiter==3.8.0 limits==3.13.0
          pip install pip-audit

      - name: Run tests
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m unittest tests.test_core tests.test_additional -v 2>&1 | tee test-output.txt
          # unittest 在没收集到任何测试时会 exit 5, 但我们的用例一定存在
          STATUS=${PIPESTATUS[0]}
          echo "unittest exit code: $STATUS"
          exit $STATUS

      - name: Security audit
        shell: bash
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          echo "🔍 Running pip-audit (only on primary matrix entry)..."
          pip-audit --strict --vulnerability-service osv 2>&1 | tee audit-output.txt || true
          # pip-audit 默认非零退出表示发现漏洞但我们用 || true 不阻塞

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-output.txt
